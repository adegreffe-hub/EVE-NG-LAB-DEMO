system {
    host-name isp-pe2;
    root-authentication {
        encrypted-password "$6$eveiaclab$rjCUEPRR7BZ7/7WzSPf4ktSLCSHsTcMxz1XVuHWS.hqzsOoLT4wnE96gqSwNVD8Jfb8ql3Npriq74vTfCJ1br/";
    }
    services {
        ssh {
            root-login allow;
        }
    }
}
interfaces {
    ge-0/0/0 {
        description "to customer CE ce-b";
        unit 0 {
            family inet {
                address 100.64.2.0/31;
            }
        }
    }
    ge-0/0/1 {
        description "to isp-p1";
        unit 0 {
            family inet {
                address 100.64.0.3/31;
            }
            family iso;
            family mpls;
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.255.0.2/32;
            }
            family iso {
                address 49.0001.0102.5500.0002.00;
            }
        }
    }
}
routing-options {
    router-id 10.255.0.2;
    autonomous-system 64500;
}
protocols {
    isis {
        level 1 disable;
        level 2 wide-metrics-only;
        interface ge-0/0/1.0 {
            point-to-point;
        }
        interface lo0.0 {
            passive;
        }
    }
    mpls {
        interface ge-0/0/1.0;
    }
    ldp {
        interface ge-0/0/1.0;
    }
    bgp {
        group IBGP-VPN {
            type internal;
            local-address 10.255.0.2;
            family inet-vpn {
                unicast;
            }
            neighbor 10.255.0.1;
        }
    }
}
routing-instances {
    CUST {
        instance-type vrf;
        interface ge-0/0/0.0;
        route-distinguisher 10.255.0.2:100;
        vrf-target target:64500:100;
        vrf-table-label;
        protocols {
            bgp {
                group CE {
                    type external;
                    peer-as 65020;
                    neighbor 100.64.2.1;
                }
            }
        }
    }
}
