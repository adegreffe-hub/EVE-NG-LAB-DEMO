hostname isp-p1
service routing protocols model multi-agent
!
ip routing
mpls ip
!
interface Ethernet1
   description to isp-pe1
   no switchport
   ip address 100.64.0.1/31
   mpls ip
   isis enable CORE
   isis network point-to-point
!
interface Ethernet2
   description to isp-pe2
   no switchport
   ip address 100.64.0.2/31
   mpls ip
   isis enable CORE
   isis network point-to-point
!
interface Loopback0
   ip address 10.255.0.254/32
   isis enable CORE
!
router isis CORE
   net 49.0001.0102.5500.0254.00
   is-type level-2
   passive-interface Loopback0
   address-family ipv4 unicast
!
mpls ldp
   router-id interface Loopback0
   transport-address interface Loopback0
   no shutdown
!
end
